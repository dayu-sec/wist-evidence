# wist-evidence 示例配置（本地联调口径：内存索引 + 本地目录存正文，重启不丢）
#
# 生产口径见 README「对象存储：两种模式」：`index.kind = "postgres"`、`objects.kind = "s3"`，
# 并用 `${SEC_...}` 引用密钥（由 `WIST_EVIDENCE_SEC_FILE` 指向的 YAML 提供）。

# ── 写面：数据面 http_sink 直投（明文，只绑内网）────────────────────────────
[sink]
listen_addr = "127.0.0.1:19173"
max_body_bytes = 4194304
# P0 只开调查报告；`diagnose_report` 等加进这个列表即可（枚举已就绪）。
allowed_kinds = ["investigation_report"]

# 三字段形状（`cust_id` / `cmd_id` / `content`）的默认口径。
# 租户就是客户：`cust_id` 直接当分区键（对象键第一段 + 索引租户列）。
default_kind = "investigation_report"
default_schema = "wist.evidence/v1"
default_sensitivity = "paths"

# 认证：写入端点不校验（内网可信）；P1 换成 HTTPS 双向认证。

# ── 读面：内部服务（mTLS + scope；P0 由 TLS 终结层注入身份头）────────────────
[read]
listen_addr = "127.0.0.1:19174"
# 读口最小鉴权：配了就必须带 `x-evidence-service-token`。
# 不配 = 保持旧行为（身份头是调用方自述，只靠网络隔离），启动日志会 warn。
# service_token = "${SEC_EVIDENCE_READ_TOKEN}"

# ── 客户存储（必填，至少一条）──────────────────────────────
# 每个客户一套独立索引 + 独立对象目录：**没有默认后端**。
# 未在下面登记的 `cust_id` 写入会回 400（evidence_customer_unregistered）。
#
# 单客户站点也要显式登记一个 cell；多客户就重复整段 `[[storage.cell]]`。
[[storage.cell]]
cust_id = "c-001"

[storage.cell.index]
kind = "memory" # memory | postgres
# database_url = "${SEC_EVIDENCE_DB_URL}"

# 对象存储：file（本地目录，测试与现场验证用，重启不丢、能直接看文件，不支持预签名）
# 或 s3（S3 兼容：腾讯 COS / MinIO，生产用，支持短签名 URL）。
[storage.cell.objects]
kind = "file"
dir = "data/objects"
bucket = "wist-evidence-dev"
# 生产（COS / MinIO，S3 兼容）：
# kind = "s3"
# endpoint = "${SEC_COS_ENDPOINT}"
# region = "${SEC_COS_REGION}"
# access_key = "${SEC_COS_SECRET_ID}"
# secret_key = "${SEC_COS_SECRET_KEY}"
