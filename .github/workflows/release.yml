name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # 1. 按平台**原生**编译二进制，产出 tarball（直接下载 + 供 Docker 镜像用）。
  #
  #    不在镜像里编译：buildx 多架构会把 arm64 丢给 QEMU，sqlx / aws-sdk 能编到 40 分钟以上。
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 容器镜像用 gnu 目标（镜像基础是 ubuntu:24.04，同一条 glibc 线）。
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cargo build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "target/${{ matrix.target }}/release/wist-evidence" artifacts/wist-evidence
          cp wist-evidence.example.toml artifacts/wist-evidence.example.toml
          tar -czf "wist-evidence-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" \
            -C artifacts wist-evidence wist-evidence.example.toml
          ls -lh "wist-evidence-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: wist-evidence-${{ matrix.target }}
          path: wist-evidence-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  # 2. 用 Linux 二进制构建并推送多架构镜像（ghcr.io）。
  docker:
    needs: [build-binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: wist-evidence-*-linux-gnu
          path: staged
          merge-multiple: true

      - name: Stage binaries for docker build
        run: |
          set -euo pipefail
          mkdir -p docker/amd64 docker/arm64
          tar -xzf "staged/wist-evidence-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz" -C docker/amd64
          tar -xzf "staged/wist-evidence-${{ github.ref_name }}-aarch64-unknown-linux-gnu.tar.gz" -C docker/arm64
          ls -R docker/amd64 docker/arm64

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          # 预发布 tag 只推该 tag，不覆盖 :latest（stack 按固定 tag 拉）。
          tags="ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          case "${{ github.ref_name }}" in
            *-*)
              ;;
            *)
              tags="$(printf '%s\n%s' "$tags" "ghcr.io/${{ github.repository }}:latest")"
              ;;
          esac
          printf 'tags<<__EOF__\n%s\n__EOF__\n' "$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64

  # 3. tarball 发到 GitHub Release。
  release:
    needs: [build-binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: wist-evidence-*
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
          generate_release_notes: true
          files: artifacts/*.tar.gz
